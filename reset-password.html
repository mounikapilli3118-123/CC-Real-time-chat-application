<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Reset Password</title>

    <link
        rel="stylesheet"
        href="css/reset-password.css"
    >

</head>

<body>

    <div class="reset-container">

        <div class="reset-card">

            <div class="icon">
                🔐
            </div>

            <h1>Reset Password</h1>

            <p>
                Enter your new password below.
            </p>

            <input
                type="password"
                id="newPassword"
                placeholder="Enter new password"
            >

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm new password"
            >

            <button id="resetBtn">
                Reset Password
            </button>

            <p id="message"></p>

            <a href="login.html">
                ← Back to Login
            </a>

        </div>

    </div>

    <script
        type="module"
        src="js/reset-password.js"
    ></script>

</body>

</html>
